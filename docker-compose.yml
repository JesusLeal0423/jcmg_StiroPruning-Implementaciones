services:

  api:
    build: .
    container_name: stiro_api

    ports:
      - "8001:8000"

    volumes:
      - .:/app

    depends_on:
      - chromadb

    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

  chromadb:
    image: chromadb/chroma:0.5.5

    container_name: chromadb

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/chroma/chroma

volumes:
  chroma_data:
  